name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip          # reuse downloaded wheels (torch, RDKit) between runs

      - name: Install dependencies
        # CPU-only torch first, so requirements.txt doesn't pull ~2 GB of CUDA wheels
        run: |
          pip install "$(grep '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
